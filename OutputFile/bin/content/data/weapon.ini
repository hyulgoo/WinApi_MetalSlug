; 무기와 투사체: 플레이어 총알·폭탄·칼, 적 토사물·수류탄·칼, 맞은 자리 이펙트. 형식과 단위는 game.ini 맨 위 참고
; 속도·자리는 오른쪽으로 쏘거나 던질 때 값이다 (왼쪽이면 x를 뒤집는다)

[projectile]           ; 땅에 닿지 못하고 화면 주변(픽셀 충돌을 검사하는 범위) 밖으로 나간 투사체를 지운다 (폭탄·토사물·수류탄)
remove_left   = -100   ; 화면 x가 이보다 작으면
remove_right  = 400    ; 화면 x가 화면 너비 + 이 값보다 크면
remove_bottom = 200    ; 화면 y가 화면 높이 + 이 값보다 크면

[bullet]               ; 권총·HMG 총알 (CHandgun)
size          = 1, 1   ; 총알 크기 (= 맞는 범위. 땅·벽 판정도 이 크기로)
speed         = 1300
life_time     = 0.75   ; 이 시간이 지나면 사라진다
draw_magni    = 3.3    ; 그림 배율 (애니메이션 3.5보다 조금 작게). 그림 버퍼가 50px라 그림 크기 x 배율이 50을 넘으면 잘린다
side_left_top = 4, 5   ; 옆으로 쏜 총알 그림 (texture\Weapone.bmp 안의 자리와 크기, px)
side_size     = 10, 6
vert_left_top = 78, 3  ; 위·아래로 쏜 총알 그림
vert_size     = 6, 10

[bomb]                 ; 플레이어 수류탄 (CBomb). 처음 땅에 닿으면 한 번 튀고, 다시 닿을 때 터진다
throw_speed    = 500, -300
bounce_ratio   = 0.5   ; 튈 때 가로 속도 = 던질 때 가로 속도 x 이 값 (세로는 던질 때와 같다)
bounce_timeout = 1     ; 튄 뒤 이 시간 안에 땅에 다시 닿지 못하면(벽 틈 등) 그 자리에서 터진다
size           = 20, 20
collider_size  = 10, 10
gravity        = 1500
friction       = 300
friction_scale = 3

[knife]                ; 플레이어 칼 판정 (CPlayerCQC). 손 자리(player.ini 총구 left·right)에 생긴다
size      = 120, 120
offset    = 0, 10      ; 판정 가운데 (손 자리에서)
life_time = 0.05

[knife_area]           ; 칼을 쓸 거리인지 감지하는 범위 (CCQCArea). 몸 앞 player.ini [attack] cqc_area_offset 에 있다
size   = 120, 120
offset = 0, -15

[effect]               ; 총알·폭탄이 맞은 자리 이펙트 (CWeaponEffect)
jitter_x = 5           ; 같은 자리에 겹쳐도 똑같아 보이지 않게 절반은 이만큼 오른쪽에 둔다

[zombie_vomit]         ; 좀비 토사물 (CZB_Bullet). 중력은 강체 처음 값(game.ini [rigidbody])
speed         = 700, -200
size          = 20, 20
collider_size = 10, 10

[soldier_grenade]      ; 병사 수류탄 (CSLD_Grenade). 땅에 닿으면 터진다
throw_speed    = 400, -600
size           = 20, 20
collider_size  = 10, 10
gravity        = 1500
friction       = 300
friction_scale = 3

[soldier_knife]        ; 병사 칼 판정 (CSLDCQC)
size      = 40, 40
offset_x  = 40         ; 보는 쪽으로 이만큼 앞
life_time = 0.001      ; 한 프레임만
