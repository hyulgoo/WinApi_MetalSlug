; 게임 수치 데이터 (CDataMgr가 읽는다)
;   형식: [구역] 아래에 "키 = 값". ; 또는 # 뒤는 주석. 두 값은 "x, y", 색은 "r, g, b"(0~255). UTF-8로 저장한다
;   이 폴더의 파일은 레벨에 들어갈 때마다 다시 읽는다. 게임을 켠 채 고치고 그 레벨에 다시 들어가면 바뀐 값으로 만든다
;   단, 이 파일의 [window]·[time]·[scale]은 실행할 때 한 번만 읽는다 (바꾸면 다시 실행)
;   값이 없거나 숫자가 아니면 오류 창으로 알리고 0으로 쓴다 (자동 테스트에서는 errors로 센다)
; 길이는 월드 px(카메라가 처음 자리에 있으면 화면 px와 같다), 시간은 초, 속도는 px/초

[window]
width  = 1200      ; 게임 화면 크기. 화면 배치 값(stage·title·editor)은 이 크기에 맞춰져 있다
height = 800

[time]
fps     = 60       ; 프레임 제한 (원작과 같은 60 FPS). 코어 하나를 다 쓰지 않게 남는 시간은 쉰다
min_fps = 30       ; 이보다 느린 프레임은 게임 시간을 늦춘다 (한 프레임 상한 = 1/min_fps 초).
                   ; 창을 끌거나 브레이크포인트에 걸려 프레임이 길어져도 지형을 뚫지 않게

[scale]
background = 4     ; 스테이지 배경 텍스처 1px이 월드에서 차지하는 길이. 레벨 파일·픽셀 충돌 맵의 좌표 x 이 값 = 월드 좌표
animation  = 3.5   ; 애니메이션 시트 1px을 화면에 그리는 배율 (프레임 오프셋도 이 배율로 커진다)

[split_draw]       ; 상체·하체로 나눠 그리는 애니메이션(플레이어, 에디터 미리보기)을 몸 기준점에 맞추는 추가 오프셋 (시트 px, 원작자가 맞춘 값)
upper_offset = -5.7, -25
lower_offset = -5.7, 0

[rigidbody]        ; 강체(CRigidbody)의 처음 값. 오브젝트마다 바꾸는 값은 그 오브젝트의 파일에 있다
mass           = 1
friction       = 400   ; 땅에서 움직임을 줄이는 힘 (friction x friction_scale x mass 만큼 1초에 줄인다)
friction_scale = 3
velocity_limit = 1000  ; 속도 상한 (중력을 쓰면 가로 속도만)
gravity        = 500   ; 중력 가속도 (px/초²). 중력은 오브젝트가 켤 때만 쓴다
fall_limit     = 1000  ; 중력으로 떨어지는 속도 상한
fall_speed     = 300   ; 픽셀 충돌을 쓰는 오브젝트가 땅까지 등속으로 내려오는 속도. 0이면 내려오지 않는다

[pixel_collider]
ground_probe   = 10    ; 발밑 이만큼 아래가 땅이 아니면 공중에 있다고 본다
platform_band  = 40    ; 발판(보스가 떨어뜨린 비석)의 윗면에서 이만큼 아래까지 발이 들어오면 윗면에 올린다. 위로 올라가는 중이면 지나간다
platform_stick = 32    ; 발판에 서 있었으면 윗면이 이만큼 내려가도(가라앉는 비석) 따라 내려간다

[debug]                ; Debug 빌드의 디버그 키 (Release에서는 쓰지 않는다)
move_speed = 300       ; 스테이지 W A S D 순간 이동 속도
info_pos   = -300, 40  ; 스테이지 좌표 표시 위치 (x가 음수면 화면 오른쪽 끝에서)
