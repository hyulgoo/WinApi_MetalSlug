; 플레이어 (CPlayer). 형식과 단위는 game.ini 맨 위 참고
; 위치는 몸 기준점(발 위 몸 가운데, 오브젝트 위치)에서 잰다. 오른쪽을 볼 때 값이고, 왼쪽을 보면 x를 뒤집는 값은 그렇게 적었다

[move]
speed             = 330   ; 걷는 속도
bow_speed_div     = 3     ; 앉아서 걸을 때는 speed / 이 값
jump_speed        = 800   ; 점프할 때 위로 주는 속도
move_detect_speed = 50    ; 화면에서 이보다 빠르게 움직였을 때만 걷는 것으로 보고 몸을 돌린다.
                          ; [camera] pushback_speed 보다 크고 speed / bow_speed_div 보다 작아야 한다

[physics]
velocity_limit = 200      ; 강체 가로 속도 상한
friction       = 500
gravity        = 1000     ; 중력 가속도 (px/초²)

[camera]                  ; 플레이어가 미는 카메라 (스테이지 끝은 stage.ini [camera] end_x)
push_ratio     = 0.45     ; 화면 너비의 이 비율보다 오른쪽으로 가면 카메라를 민다
scroll_div     = 3        ; 카메라를 미는 속도 = [move] speed / 이 값 (배경 텍스처 px/초)
bow_scroll_div = 9        ; 앉아서 밀 때
pushback_speed = 10       ; 카메라를 미는 동안 플레이어를 기준선 쪽으로 되돌리는 속도

[body]
stand_size   = 80, 120    ; 서 있을 때 몸 크기. 화면 끝에서 멈추는 자리·총구 높이·발 판정에도 쓴다
stand_center = 0, -15     ; 서 있을 때 몸 가운데. 피격 범위의 가운데
bow_size     = 80, 60     ; 앉았을 때 몸 (아래쪽 절반)
bow_center   = 0, 30
hitbox_ratio = 0.8        ; 피격 범위 = 몸 크기 x 이 값 (2026-10-15 요청: 실제 크기의 80% 정도로)

[life]
count           = 3       ; 처음 남은 목숨 (화면에 보이는 수). 0인 채로 죽으면 게임 오버라 count + 1번 플레이한다
spawn_pos       = 100, 500 ; 소환되는 화면 위치 (스테이지 시작, 다시 나올 때)
summon_time     = 0.43    ; 소환 연출 길이
dead_time       = 2.7     ; 사망 연출 길이 (DEAD_SLIME 애니메이션 2.74초보다 조금 짧다)
invincible_time = 3       ; 다시 나온 뒤 무적 시간

[ammo]
start_bullet   = 20       ; 처음 HMG 탄 (권총은 무한)
start_bomb     = 10
respawn_bullet = 0        ; 다시 나올 때 (무기는 권총으로)
respawn_bomb   = 10
item_bullet    = 100      ; HMG 상자 하나: HMG로 바꾸고 탄을 이만큼 더한다
item_bomb      = 10       ; 폭탄 상자 하나

[attack]
hold_interval     = 0.15  ; C를 누르고 있을 때 사격 자세를 다시 잡는 간격
cqc_hold_interval = 0.6   ; 칼 거리 안일 때
pistol_interval   = 0.15  ; 권총 연사 간격
hmg_interval      = 0.05  ; HMG 연사 간격
knife_interval    = 0.25  ; 칼 연속 베기 간격
pistol_pose_time  = 0.52  ; 쏜 뒤 사격 자세를 유지하는 시간
hmg_pose_time     = 0.28
knife_pose_time   = 0.6
hmg_bow_knife_pose_time = 0.4   ; HMG를 들고 앉아서 벨 때
bomb_pose_time    = 0.5   ; 폭탄 던지는 자세
cqc_area_offset   = 50    ; 칼 거리 감지 범위(weapon.ini [knife_area])를 몸 앞 이만큼에 둔다

; 총구 자리: 몸 기준점에서 총알 그림의 왼쪽 위까지. 그다음 [body] stand_size 높이 x raise(앉으면 bow_raise)만큼 위로 올린다
; 폭탄·칼은 손으로 쓰므로 위·아래를 보고 있어도 left·right 자리에서 나간다
[muzzle_pistol]
up_left   = -10, -100     ; 위를 볼 때 (왼쪽을 보고 있었으면)
up_right  = -5, -100      ; 위를 볼 때 (오른쪽)
down      = 0, 100        ; 공중에서 아래를 볼 때
left      = -100, 5       ; 옆
right     = 100, 5
raise     = 0.5
bow_raise = 0.3

[muzzle_hmg]
up_left   = -10, -180
up_right  = -5, -180
down      = 0, 100
left      = -95, 30
right     = 95, 30
raise     = 0.5
bow_raise = 0.5
