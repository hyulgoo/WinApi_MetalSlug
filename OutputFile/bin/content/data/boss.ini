; 보스: 모세의 십계 (메탈슬러그 3 미션 2). 1페이즈(초록 돔이 비석을 떨어뜨린다)까지. 형식과 단위는 game.ini 맨 위 참고
; 보스가 나오는 자리(발밑)와 시점은 level\Stage01.level 의 BOSS 항목, 애니메이션은 animation\Boss\
; 받는 피해는 다른 몬스터와 같다 (monster.ini [damage])

[boss]                     ; CBoss
hp              = 200      ; 권총 한 발 1, 수류탄 10, 칼 4
size            = 553, 574 ; 몸 그림 크기 (BOSS_IDLE 158x164 x 애니메이션 배율 3.5). 위치는 이 상자의 가운데, 발밑은 아래 끝
collider_size   = 448, 217 ; 맞는 범위: 돔 (128x62 x 3.5). 원작처럼 위로 쏘거나 높은 비석 위에서 쏴야 맞는다.
collider_offset = 0, -178.5 ; 받침대는 배경 쪽이라 총알이 앞을 지나간다 (땅에 선 플레이어의 칼 거리 감지에도 닿지 않는다)
wait_time       = 2.5      ; 다음 공격까지 기다리는 시간 (등장한 뒤, 공격이 끝난 뒤)
summon_frame    = 2        ; BOSS_ATTACK(돔이 빛기둥을 쏜다): 이 프레임에 들어설 때 조준 빔을 부른다

[appear]                   ; 돌무덤 자리에서 솟아오른다. 그동안은 피해를 받지 않는다
time           = 3         ; 다 올라오는 시간
depth          = 574       ; 처음에 땅 아래로 들어가 있는 깊이 (몸 높이면 다 묻혀 있다)
shake_range    = 8         ; 그동안 카메라 흔들림: 좌우 폭(px), 속도(px/초)
shake_speed    = 400
burst_interval = 0.4       ; 발밑에서 먼지 기둥(BOSS_EMERGE)이 솟는 간격
burst_spread   = 220       ; 먼지 기둥이 생기는 가로 범위 (가운데에서 ±)

[beam]                     ; 조준 빔 (CMonolithBeam): 하늘에서 내려와 플레이어를 따라오다 멈추면 그 자리에 비석이 떨어진다
track_time  = 1.2          ; 플레이어를 따라오는 시간
track_speed = 250          ; 따라오는 최고 속도 (플레이어 걷기 330보다 느려서 달아날 수 있다)
lock_time   = 0.5          ; 멈춘 뒤 비석이 떨어지기 시작할 때까지
linger_time = 0.3          ; 비석을 떨어뜨린 뒤 빔이 남아 있는 시간

[monolith]                 ; 비석 (CMonolith). 땅에 박히면 위에 올라설 수 있고, 잠시 뒤 천천히 가라앉는다
fall_speed          = 2000 ; 화면 위 밖에서 떨어지는 속도
crush_time          = 0.001 ; 박히는 순간 비석 자리에 있으면 깔려 죽는다 (판정이 남아 있는 시간. 한 프레임)
shake_range         = 6    ; 박힐 때 카메라 흔들림
shake_speed         = 300
shake_time          = 0.25
hold_time           = 2    ; 박힌 뒤 가라앉기 시작할 때까지
sink_frame_time     = 0.25 ; 가라앉는 그림(MONOLITH 33장) 한 장의 시간. 다 가라앉으면 돌무더기(MONOLITH_RUBBLE)를 잠깐 남긴다
hit_bullet          = 0.05 ; 맞으면 가라앉기를 이만큼(초) 앞당긴다: 총알 한 발
hit_grenade         = 1    ; 수류탄
collapse_frame_time = 0.03 ; 보스가 부서지면 남은 비석은 이 간격으로 빨리 가라앉는다 (더는 깔리지 않는다)
top_inset           = 6    ; 밟는 윗면을 그림 위 끝에서 이만큼 아래로 (px)

[wreck]                    ; 부서진 보스 (CBossWreck): 돔이 깨진 받침대 위로 폭발이 이어지고, 끝나면 플레이어가 승리 포즈
explosion_time     = 3     ; 폭발이 이어지는 시간
explosion_interval = 0.12  ; 폭발 간격 (BOSS_EXPLOSION_A·B를 번갈아)
explosion_area     = 448, 458 ; 폭발이 생기는 상자 (보스 위치에서 explosion_offset만큼 옮긴 가운데)
explosion_offset   = 0, -58
shake_range        = 10    ; 폭발하는 동안 카메라 흔들림
shake_speed        = 500
victory_delay      = 1     ; 폭발이 끝나고 승리 포즈까지 (그 뒤는 stage.ini [clear])
