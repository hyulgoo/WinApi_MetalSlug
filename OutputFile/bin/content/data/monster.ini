; 몬스터: 공통(CMonster), 좀비 다섯 종(CZombie), 병사(CSoldier), 연구원 좀비가 남기는 상자(CItem). 형식과 단위는 game.ini 맨 위 참고
; 공격 프레임은 공격 애니메이션의 프레임 번호다 (0부터. 그 프레임에 들어설 때 공격이 나간다)
; 자리는 몬스터가 오른쪽을 볼 때 값이다 (왼쪽을 보면 x를 뒤집는다)

[common]
remove_screen_x = -30   ; 화면 x가 이보다 작으면(화면 왼쪽 밖) 지운다

[damage]                ; 몬스터가 받는 피해
bullet  = 1             ; 권총·HMG 한 발
grenade = 10            ; 플레이어 수류탄 (불에 타 죽는다)
knife   = 4             ; 칼

[item]                  ; 연구원 좀비가 죽으면 남기는 상자. 늘어나는 양은 player.ini [ammo] item_bullet·item_bomb
roll     = 10           ; 몬스터가 생길 때 0 ~ (roll - 1) 중 하나를 뽑아 둔다
hmg_from = 6            ; 뽑은 수가 이 값 이상이면 HMG 상자, 아니면 폭탄 상자 (지금 값이면 HMG 40%)
size     = 70, 70

[zombie]                ; 좀비 다섯 종이 함께 쓰는 값
hp              = 10
speed           = 80
attack_range    = 300   ; 플레이어가 이 거리 안이면 토한다
detect_range    = 700   ; 이 거리 안이면 쫓아온다
collider_offset = 0, -15
death_offset_y  = 70    ; 사망 이펙트·상자를 발밑(아래로 이만큼)에 둔다

; 좀비 종류마다 다른 값. fire_frame은 예전 타이머(초)와 같거나 가장 가까운 공격 애니메이션 프레임의 시작이다
[zombie_boy]
fire_frame    = 22      ; ZB_BOY_ATTACK: 2.64초 = 22번 (0.12초 x 22)
size          = 70, 130
bullet_offset = 50, -90 ; 토사물이 나오는 자리 (몸 기준점에서)

[zombie_girl]
fire_frame    = 14      ; ZB_GIRL_ATTACK: 1.82초 = 14번 (0.13초 x 14)
size          = 60, 130
bullet_offset = 70, -70

[zombie_man]
fire_frame    = 18      ; ZB_MAN_ATTACK: 1.82초에 가장 가까운 18번 (1.86초)
size          = 70, 130
bullet_offset = 30, -70

[zombie_old]
fire_frame    = 9       ; ZB_OLD_ATTACK: 1.08초 = 9번 (0.12초 x 9)
size          = 90, 130
bullet_offset = 30, -70

[zombie_researcher]     ; 연구원: 죽으면 상자를 남긴다
fire_frame    = 15      ; ZB_RCH_ATTACK: 1.82초에 가장 가까운 15번 (1.80초)
size          = 70, 130
bullet_offset = 30, -70

[soldier]               ; 반란군 병사: 멀면 수류탄, 가까우면 천천히 다가가 칼
hp              = 1
speed           = 160
attack_range    = 400
detect_range    = 700
size            = 80, 130
collider_offset = 0, -15
death_offset_y  = 70
cqc_ratio       = 0.2   ; attack_range x 이 값보다 가까우면 칼
sly_ratio       = 0.5   ; 그다음 attack_range x 이 값까지는 천천히 다가간다. 그 밖은 수류탄
sly_speed_div   = 2     ; 천천히 다가갈 때는 speed / 이 값
grenade_frame   = 10    ; SOLDIER_BOMB: 수류탄을 놓는 프레임 (예전 0.8초 = 10번 시작, 0.08초 x 10)
knife_frame     = 9     ; SOLDIER_CQC: 칼을 휘두르는 프레임 (예전 0.7초에 가장 가까운 9번 시작, 0.71초)
grenade_offset  = 0, -50 ; 수류탄이 나오는 자리
