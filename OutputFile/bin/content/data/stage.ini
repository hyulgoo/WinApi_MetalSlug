; 스테이지 (CStage): 규칙, 카메라, 배경 조각, 화면 위 정보(HUD). 형식과 단위는 game.ini 맨 위 참고
; 카메라 경로·몬스터 배치는 level\Stage01.level 에 있다

[rule]
time           = 59     ; 남은 시간 (화면의 두 자리 수). 다 되면 플레이어가 죽고 다시 채운다
time_tick      = 15     ; 남은 시간을 1 줄이는 간격 (초)
fall_y         = 1500   ; 플레이어가 화면 y 이보다 아래로 떨어지면 다시 소환한다
fall_respawn_y = 600    ; 그때 소환하는 화면 높이 (x는 그대로)
fade_in        = 3      ; 들어올 때 화면이 밝아지는 시간

[camera]
path_speed = 300        ; 카메라가 경로를 따라 위아래로 움직이는 최고 속도 (배경 텍스처 px/초)
end_x      = 6322       ; 카메라가 멈추는 스테이지 끝. 화면의 플레이어 x + 카메라 왼쪽 위의 배경 텍스처 x + 화면 너비 절반으로 잰다 (예전 식 그대로)

[background]
front1_pos   = 3658, 508  ; 캐릭터 앞에 그리는 배경 조각 texture\BackGround_Front01.bmp (월드 좌표, 그림의 왼쪽 위)
front2_pos   = 5815, 322  ; texture\BackGround_Front02.bmp
far_magni    = 6          ; 먼 배경(texture\BackGround_Back.bmp)을 그리는 배율
far_parallax = 3.3        ; 먼 배경은 카메라보다 이 배 천천히 움직인다 (원근감)
far_top      = 40         ; 먼 배경 텍스처의 위쪽 이만큼(px)은 쓰지 않는다

[hud]                   ; 화면 위 정보. 그림은 magni 배로 그리고, 숫자 칸의 자리는 패널 안의 자리다
magni               = 4
hp_panel_pos        = 50, 80    ; 목숨 패널 (texture\HUD_HP.bmp)
life_pos            = 180, 15   ; 목숨 숫자
life_size           = 50
life_label_left_top = 0, 27     ; 목숨 숫자 앞의 글자 그림 (texture\NUMBER.bmp 안의 자리와 크기, px)
life_label_size     = 26, 10
life_label_x        = -140      ; 목숨 숫자에서 이만큼 옆에 그린다
weapon_panel_pos    = 320, 40   ; 무기 패널 (texture\HUD_WEAPONE.bmp)
bomb_digit_size     = 12        ; 폭탄 두 자리
bomb_digit1_pos     = 168, 12
bomb_digit2_pos     = 200, 12
bullet_digit_size   = 10        ; 총알 세 자리
bullet_digit1_pos   = 43, 12
bullet_digit2_pos   = 75, 12
bullet_digit3_pos   = 107, 12
time_digit_size     = 10        ; 남은 시간 두 자리 (TIME_NUMBER.anim 그림)
time_digit1_pos     = 260, -90
time_digit2_pos     = 325, -90
infinite_frame      = 10        ; 권총일 때 총알 첫 자리에 그리는 Number.anim 프레임 (무한 표시)
