; 애니메이션 에디터 (CAnimEditor와 패널·버튼·미리보기). 형식과 단위는 game.ini 맨 위 참고 (자리는 화면 px)

[view]
sheet_magni     = 3        ; 들어올 때 시트 배율 (1~4 키로 바꾼다)
panel_width_div = 4        ; 오른쪽 패널 폭 = 화면 너비 / 이 값
preview_y_ratio = 0.625    ; 미리보기 기준점 높이 (화면 높이에 대한 비율). 가로는 패널 가운데
guide_size      = 50, 44   ; 미리보기 기준선: 가로선 반 길이, 기준점에서 가로선까지 (세로선도 위로 같은 길이)
sheet_keep      = 64       ; 시트를 옮겨도 편집 영역에 이만큼은 남긴다
scroll_speed    = 1000     ; 화살표로 시트를 옮기는 속도 (px/초)
scroll_fast     = 3        ; Shift를 누르면 이 배

[input]
repeat_delay    = 0.4      ; 키를 누르고 이만큼 지나면 반복한다
repeat_interval = 0.05     ; 반복 간격

[edit]
default_duration = 0.1     ; 드래그로 만든 프레임의 재생 시간 (초)
max_undo         = 200     ; 되돌리기 기록 수
max_grid_count   = 100     ; 격자로 한 번에 만들 수 있는 프레임 수

[grid]                     ; "격자로 프레임 추가"의 처음 값 (고르고 있는 프레임이 없을 때. 시트 px, 재생 시간은 0.01초 단위)
width    = 32
height   = 32
count    = 4
duration = 10

[panel]                    ; 오른쪽 패널의 버튼과 글자
button_size         = 90, 30
buttons_per_row     = 3       ; 버튼을 한 줄에 이만큼 놓는다
button_gap          = 5
margin              = 10      ; 패널 가장자리에서 버튼·글자까지
info_top            = 160     ; 버튼 아래 정보 글자가 시작하는 높이
line_height         = 18
info_color          = 0, 0, 0 ; 패널 정보 글자
sheet_text_color    = 255, 255, 255  ; 시트 위 글자 (프레임 번호, 끌고 있는 사각형 크기)
frame_number_offset = 2, 1    ; 프레임 번호를 사각형 왼쪽 위에서 이만큼
drag_text_offset    = 4, 4    ; 끌고 있는 사각형의 크기 글자를 사각형 오른쪽 아래에서 이만큼
mouse_text_pos      = 10, -24 ; 마우스 아래 시트 픽셀 글자 (y가 음수면 화면 아래에서)

[button]
color       = 255, 255, 255
hover_color = 225, 230, 250  ; 마우스가 올라가면
press_color = 190, 200, 240  ; 누르고 있으면
