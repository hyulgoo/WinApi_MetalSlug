; 타이틀(캐릭터 선택, CStartLevel·CSelectAnim)과 게임 오버(CGameOver). 형식과 단위는 game.ini 맨 위 참고

[title]
select_pos    = 340, 230   ; 캐릭터 선택 그림 자리 (화면)
select_magni  = 3.8        ; 선택 화면 그림 배율 (화면을 채우게)
shutter_magni = 4          ; 고른 뒤 셔터가 내려오는 그림 배율
shake_range   = 300        ; 고르는 순간 카메라 흔들림: 폭 (px), 속도 (px/초), 길이 (초)
shake_speed   = 200
shake_time    = 1.5
fade_out_at   = 0.5        ; 고르고 이만큼 지나면 화면이 어두워지기 시작한다
fade_out_time = 1          ; 어두워지는 시간
stage_at      = 1.5        ; 고르고 이만큼 지나면 스테이지로
help_pos      = 20, 770    ; 아래 도움말 글자 자리 (화면)
help_color    = 255, 255, 255

[gameover]
fade_in   = 7              ; 들어올 때 화면이 밝아지는 시간
hold_time = 2              ; C를 이만큼 누르고 있으면 타이틀로
